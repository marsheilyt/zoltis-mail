name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: python -m pytest -q tests
      - name: Shell syntax
        run: for f in install.sh scripts/*.sh docker/*/entrypoint.sh; do bash -n "$f"; done
      - name: Compose file
        run: cp .env.example .env && docker compose config -q
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
