# Zoltis Mail - Dovecot 2.3 (Debian 12). Mailboxes, IMAP, LMTP delivery, quotas.
# Accounts come from /etc/dovecot/zoltis/users, rendered by the admin console.

protocols = imap lmtp
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes

mail_location = maildir:/var/vmail/%d/%n/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_plugins = $mail_plugins quota

ssl = required
ssl_cert = </etc/dovecot/tls/fullchain.pem
ssl_key = </etc/dovecot/tls/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
# Forward secrecy + AEAD ciphers only
ssl_cipher_list = ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!eNULL:!MD5:!SHA1:!DSS
ssl_cipher_suites = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
ssl_curve_list = X25519:secp384r1:prime256v1

# Only the Zoltis web container (fixed IP on the private Docker network) may use
# plaintext IMAP on port 143 (never published) and the master login.
login_trusted_networks = __WEB_IP__/32
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_master_user_separator = *

passdb {
  driver = passwd-file
  args = /etc/dovecot/zoltis/master-users
  master = yes
  pass = yes
}
# App passwords for mail apps (accounts with two-step verification). Checked before the
# account password; a mismatch here falls through to the next passdb.
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%Lu /etc/dovecot/zoltis/app-passwords
}
# Account passwords. With two-step verification on, the entry carries allow_nets=<web
# container>, so the account password only works through the webmail (which asks for the code).
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%Lu /etc/dovecot/zoltis/users
}
userdb {
  driver = passwd-file
  args = username_format=%Lu /etc/dovecot/zoltis/users
  default_fields = uid=vmail gid=vmail home=/var/vmail/%d/%n
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
    # Deleted mail is removed for good 7 days after it was moved to Trash (also from phones/Outlook).
    autoexpunge = 7d
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    # Spam is removed for good 10 days after it arrived in Spam, whether it was opened or not.
    autoexpunge = 10d
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
# Delivery from Postfix
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
# SMTP AUTH for Postfix
service auth {
  inet_listener auth {
    port = 12345
  }
}
# Postfix asks this before accepting mail: rejects messages for full mailboxes
service quota-status {
  executable = quota-status -p postfix
  inet_listener quota-status {
    port = 12340
  }
  client_limit = 1
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 50
}
protocol lmtp {
  mail_plugins = $mail_plugins quota
  postmaster_address = postmaster@__MAIL_HOST__
}

plugin {
  quota = count:User quota
  quota_vsizes = yes
  # Default; every account gets its own rule from the users file (max 720 MB in Community)
  quota_rule = *:storage=720M
  quota_grace = 0%%
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
}
