# Zoltis Mail - local DNSSEC-validating resolver for Postfix (needed for DANE).
server:
  interface: 127.0.0.1
  port: 53
  access-control: 127.0.0.0/8 allow
  do-ip6: no
  username: "unbound"
  directory: "/etc/unbound"
  auto-trust-anchor-file: "/var/lib/unbound/root.key"
  qname-minimisation: yes
  hide-identity: yes
  hide-version: yes
  harden-dnssec-stripped: yes
  val-clean-additional: yes
  prefetch: yes
  do-not-query-localhost: no
  logfile: ""
  verbosity: 0
  # Container names on the private Docker network are answered by Docker's DNS (not signed)
  domain-insecure: "dovecot"
  domain-insecure: "web"
  domain-insecure: "clamav"
  domain-insecure: "caddy"
  domain-insecure: "postfix"

forward-zone:
  name: "dovecot"
  forward-addr: 127.0.0.11
forward-zone:
  name: "web"
  forward-addr: 127.0.0.11
forward-zone:
  name: "clamav"
  forward-addr: 127.0.0.11
forward-zone:
  name: "caddy"
  forward-addr: 127.0.0.11
forward-zone:
  name: "postfix"
  forward-addr: 127.0.0.11
